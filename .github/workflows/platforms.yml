name: Desktop platform verification

on:
  push:
    branches: ['**']
    tags: ['v*.*.*', '[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Sign and notarize macOS artifacts using configured repository secrets
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(github.ref, 'refs/tags/')
        name: Verify tag matches package version
        run: node scripts/build/release.cjs validate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npx --no-install install-electron
      - run: npm test
      - if: runner.os == 'Windows'
        run: npm run test:ui
      - if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        name: Build Windows installer
        run: node scripts/build/package.cjs
      - if: runner.os == 'macOS'
        run: npm run test:ui:platform
      - if: runner.os == 'macOS' && !inputs.signed_release
        name: Build unsigned macOS verification artifacts
        run: node scripts/build/package.cjs mac
        env:
          STUDIO_MAC_RELEASE: '0'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'macOS' && inputs.signed_release
        name: Build signed and notarized macOS release
        run: node scripts/build/package.cjs mac
        env:
          STUDIO_MAC_RELEASE: '1'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: runner.os == 'macOS'
        run: npm run test:packaged
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/Transcribe Studio Setup *.exe
            release/*.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            release/*.dmg
            output/playwright/*.png

  publish:
    name: Publish versioned GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Upload installers, checksums and generated release notes
        run: node scripts/build/release.cjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
