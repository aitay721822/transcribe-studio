<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Transcribe Studio — Logo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f5f1;color:#263632;font:16px/1.6 "Segoe UI","Microsoft JhengHei",sans-serif}
    main{max-width:1160px;margin:auto;padding:48px 56px}header{display:flex;justify-content:space-between;gap:32px;align-items:start;border-bottom:1px solid #d9e0d6;padding-bottom:24px}
    h1{font-size:32px;font-weight:500;letter-spacing:-1px;margin:0 0 8px}p{margin:0;color:#66786f}small{font-size:16px}header small{letter-spacing:2px;color:#37675a}
    .showcase{display:grid;grid-template-columns:1fr 1fr;margin-top:28px;border:1px solid #d9e0d6;border-radius:24px;overflow:hidden}
    .tile{display:flex;align-items:center;justify-content:center;min-height:330px;background:#fffefa}.tile img{width:180px;height:180px}.dark{background:#171d1b}.dark img{width:128px;height:128px}
    .lockup{padding:28px 0;display:flex;align-items:center;gap:24px;border-bottom:1px solid #d9e0d6}.lockup img{width:420px;max-width:70%}.lockup p{margin-left:auto;max-width:290px}
    footer{display:flex;align-items:center;gap:18px;padding-top:28px}.sizes{display:flex;align-items:center;gap:24px;margin-left:auto}.sizes img{display:block}.label{margin-top:8px;text-align:center;color:#66786f}
    .swatch{width:24px;height:24px;border-radius:50%;background:#37675a;flex:none}.mark{width:56px;height:56px}
    @media(max-width:700px){main{padding:24px}header{display:block}.showcase{grid-template-columns:1fr}.tile{min-height:240px}.lockup{flex-wrap:wrap}.lockup img{max-width:100%}.lockup p{margin-left:0}footer{flex-wrap:wrap}.sizes{margin-left:0}}
  </style>
</head>
<body>
  <main>
    <header><div><h1>把聲音，整理成紀錄。</h1><p>聲波延伸為筆記橫線，讓標誌在小尺寸也保有清楚輪廓。</p></div><small>TRANSCRIBE STUDIO<br>SVG BRAND MARK</small></header>
    <section class="showcase" aria-label="深淺背景預覽"><div class="tile"><img src="icon.svg" alt="彩色圖示在淺色背景"></div><div class="tile dark"><img src="icon.svg" alt="彩色圖示在深色背景"></div></section>
    <section class="lockup"><img src="logo.svg" alt="橫式 Transcribe Studio Logo"><p>森林綠與暖白。<br>圓角方形搭配柔和線端，延續會議助手的簡潔外觀。</p></section>
    <footer><span class="swatch"></span><span>#37675A</span><img class="mark" src="mark.svg" alt="透明單色版"><span>單色標誌</span><div class="sizes"><div><img src="icon.svg" width="24" height="24" alt="24px"><div class="label">24</div></div><div><img src="icon.svg" width="32" height="32" alt="32px"><div class="label">32</div></div><div><img src="icon.svg" width="48" height="48" alt="48px"><div class="label">48</div></div><div><img src="icon.svg" width="64" height="64" alt="64px"><div class="label">64</div></div></div></footer>
  </main>
</body>
</html>
